name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package.
#
# What this job can prove is bounded by content. Sony's firmware (PS3UPDAT.PUP)
# and any commercial disc are the user's to supply, so the legs that want them
# report SKIP. What runs needs neither: the machine starts, its virtual clock is
# its own, savestates round-trip, and the sandboxed build agrees with the native
# one - over the small PPC programs in tests/, which are assembled here from
# source rather than shipped as binaries.
#
# This is the expensive core. It builds LLVM twice (host and guest) and rpcs3's
# emulator library twice, which is hours on a runner and changes only when the
# pin does - hence the two build-tree caches below.
#
# Until 2026-09-20 that cost was dodged by not building the native reference at
# all, and the "Core gate" step echoed a SKIP in place of waterbox/run-gate.sh.
# Nothing then ran the gate but a developer who remembered: waterbox/native.mk
# went eight days without linking and no run anywhere said so. What made it
# affordable is that build/llvm-native was already a cache path and the job
# already builds its table generator - only the rest of that flavor, ffmpeg and
# a second rpcs3_emu were missing. See docs/PLAN.md, "What CI runs".

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 04:00 UTC. A nightly is published only when main moved since the last one;
    # the reusable workflow checks, so an unchanged core costs one idle run.
    - cron: '0 4 * * *'

# Keyed by the EVENT as well as the ref. The nightly schedule and a push to
# main are the same workflow on the same ref, so without the event in the key
# whichever starts second cancels the first - and because the publish depends
# on the gate that was cancelled, the release is skipped with nothing anywhere
# reporting a failure. They collide at all because GitHub runs these crons
# hours late: this one asks for 04:00 and starts around 08:30. A push still
# supersedes an older push on the same ref, which is what cancel-in-progress
# is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  core-gate:
    # Everything that has to be COMPILED: the guest package, the native
    # reference it is compared against, and the gate over both. The frontend
    # half is its own job below, and it builds no rpcs3 at all - it downloads
    # what this job produced. Splitting that way costs one extra runner and no
    # second package build, which is the thing that would have been expensive.
    name: "core gate (starts, deterministic, native == sandbox)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          # RECURSIVE, not true. RPCS3 keeps its own third parties as
          # submodules of a submodule - LLVM among them - and one level of
          # init leaves extern/rpcs3/3rdparty/llvm/llvm an empty directory,
          # which is where the first run of this workflow stopped.
          submodules: recursive

      - name: Check out Chimera (the waterbox host, the guest toolchain, the frontend)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 mono-complete libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev g++-13

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Check out what Chimera is built from
        working-directory: chimera-checkout
        run: git submodule update --init --recursive extern

      - name: Build Chimera's natives
        # The contract tests below open a package through the ENGINE, which is
        # libchimera - so they dlopen a native library and fail without one.
        # (Found by moving build/dll aside and watching them go red.)
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Which upstream and which LLVM this build pins
        # The keys below have to change when the SOURCE changes, and the source
        # is a submodule (and, for LLVM, a submodule of a submodule):
        # .gitmodules only names the remote, so bumping extern/rpcs3 to a newer
        # LLVM would leave the key identical and the job would restore, and
        # ship, the old one. hashFiles cannot see a gitlink either. The pinned
        # commits are the honest keys.
        id: llvm-pin
        run: |
          echo "sha=$(git -C extern/rpcs3 rev-parse HEAD:3rdparty/llvm/llvm)" >> "$GITHUB_OUTPUT"
          echo "rpcs3=$(git -C extern/rpcs3 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the host LLVM (hours to build; changes only when the pin does)
        # The v2 in the key is load-bearing. Caches under the old key hold a
        # build/llvm-native with ONLY llvm-tblgen in it, because that was all
        # this job ever built; actions/cache re-saves nothing on an exact key
        # hit, so restoring one of those and then building the rest would have
        # paid the whole native LLVM on every push, for ever, and stored none
        # of it. Bumping the key makes the first run store the full tree.
        uses: actions/cache@v4
        with:
          path: build/llvm-native
          key: rpcs3-llvm-native-v2-${{ runner.os }}-${{ hashFiles('waterbox/build-llvm.sh') }}-${{ steps.llvm-pin.outputs.sha }}

      - name: Cache the guest LLVM (also keyed on the guest toolchain)
        # A separate cache from the host's, because the GUEST's is compiled
        # with the miniBox sysroot's flags and has to be rebuilt when they
        # change. It was not, and that cost every RPCS3 push from 2026-09-21
        # onward: -mno-red-zone reached the sysroot, this key did not move,
        # every run restored a guest LLVM built without it, and check-wbx
        # refused the core over the 3,192 red-zone operands that LLVM alone
        # carried. Six consecutive runs red, nothing published. The flag lives
        # in miniBox's meson.build and the musl specs generator, so the key
        # hashes both; the host LLVM is untouched by them and keeps its cache.
        uses: actions/cache@v4
        with:
          path: build/llvm-guest
          key: rpcs3-llvm-guest-v3-${{ runner.os }}-${{ hashFiles('waterbox/build-llvm.sh', 'chimera-checkout/extern/chimera-common-minibox/meson.build', 'chimera-checkout/extern/chimera-common-minibox/extern/musl/tools/musl-gcc.specs.sh') }}-${{ steps.llvm-pin.outputs.sha }}

      - name: Cache the native reference's CMake tree
        # rpcs3_emu built a second time for the HOST. Unlike LLVM this one
        # moves with the patch series, so it is keyed on what actually changes
        # it and falls back through restore-keys to the nearest older tree -
        # ninja then rebuilds only the translation units that moved, which for
        # a push that touches waterbox/*.cpp alone is none of them.
        uses: actions/cache@v4
        with:
          path: build/native
          key: rpcs3-native-${{ runner.os }}-${{ steps.llvm-pin.outputs.rpcs3 }}-${{ steps.llvm-pin.outputs.sha }}-${{ hashFiles('patches/*.patch', 'waterbox/configure-flags.sh', 'waterbox/*.h') }}
          restore-keys: |
            rpcs3-native-${{ runner.os }}-${{ steps.llvm-pin.outputs.rpcs3 }}-${{ steps.llvm-pin.outputs.sha }}-
            rpcs3-native-${{ runner.os }}-

      - name: Build the waterbox core
        # The GUEST: what actually ships, so it is built first and fails first.
        # It also generates waterbox/generated-gl, which the native reference's
        # makefile consumes and does not produce - so this step has to come
        # before the next one, and not only because it matters more.
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          MINIBOX_DIR="$mb" ./waterbox/build-package.sh -m "$mb" -r "$PWD/chimera-checkout"

      - name: Build the native reference the gate compares against
        # The other half of "native == sandbox": rpcs3 built with the host
        # toolchain, plus the run-native driver. build-llvm.sh native finishes
        # the flavor whose table generator build-package.sh already built, so
        # on a warm LLVM cache this whole step is ninja finding nothing to do.
        run: |
          sh waterbox/build-ffmpeg.sh native
          sh waterbox/build-llvm.sh native
          sh waterbox/build-native.sh
          # -C first, then -f relative to it: make chdirs before it looks for
          # the makefile, so `-f waterbox/native.mk -C waterbox` goes looking
          # for waterbox/waterbox/native.mk. MB is not optional either - the
          # makefile's default is under $HOME, which on a runner is not the
          # checkout.
          # g++-13 is PINNED, not preferred: g++ 14 cannot build this at all -
          # a hard internal compiler error in abseil's any_invocable.h. The
          # runner's default is 13 today, so this changes nothing now and stops
          # the day ubuntu-latest moves from turning the native reference red.
          make -C waterbox -f native.mk -j"$(nproc)" CXX=g++-13 \
            MB="$PWD/chimera-checkout/extern/chimera-common-minibox"

      - name: Core gate
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          sh "$mb/source/guest/check-wbx.sh" waterbox/bin/core.wbx
          # The gate itself, at last. There is no PS3UPDAT.PUP and no disc on a
          # public runner, so twenty-one of the twenty-five legs SKIP - by name,
          # one line each, counted in the summary the script prints. The four
          # that run need no content at all, and they are exactly the four that
          # would have caught the native reference failing to link. Which legs
          # those are, and who owns running the other twenty-one, is the table
          # in docs/PLAN.md under "What CI runs".
          sh waterbox/run-gate.sh

      - name: Build and install the waterbox core package
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: ./waterbox/build-package.sh -m "$PWD/chimera-checkout/extern/chimera-common-minibox" -r "$PWD/chimera-checkout"

      - name: The package through the real frontend
        # Chimera's own contract tests, run against THIS package: it must be
        # readable, built for an ABI this frontend runs, become a working
        # factory, bind only buttons its controller declares, and stamp a
        # version. No rom, no firmware, no emulation - which is exactly why it
        # is the frontend check a core like this one can make.
        working-directory: chimera-checkout
        env:
          CHIMERA_CORES_DIR: ${{ github.workspace }}/chimera-checkout/build/Cores
        run: |
          dotnet test source/gui/Chimera.Tests.Client.Common/Chimera.Tests.Client.Common.csproj \
            -c Release --nologo \
            --filter "FullyQualifiedName~InstalledCorePackagesTests|FullyQualifiedName~MnemonicUniquenessTests"

      - name: Publish the core package
        uses: actions/upload-artifact@v7
        with:
          name: rpcs3-${{ github.sha }}
          path: chimera-checkout/build/Cores/rpcs3.chimeraCore
          if-no-files-found: error

      - name: Publish the sandbox driver the frontend gate compares against
        # run-wbx is 460 KB of host C - the gate's reference runner - and the
        # frontend job needs it to have a reference at all. It is uploaded
        # rather than rebuilt there because building it means generated-gl,
        # which is the guest build's output: rebuilding it would be CI doing
        # something subtly different from build-core.sh, which is exactly the
        # shape docs/gates.md calls failure mode G. Its RUNPATH names
        # chimera-checkout/extern/chimera-common-minibox/build/meson-linux/source/host
        # under GITHUB_WORKSPACE, which is the same absolute path in both
        # jobs - so the frontend job builds the miniBox host library there and
        # checks with ldd that it resolved.
        uses: actions/upload-artifact@v7
        with:
          name: rpcs3-run-wbx-${{ github.sha }}
          path: waterbox/bin/run-wbx
          if-no-files-found: error

      - name: Upload the gate work dir on failure
        # waterbox/work/gate is where run-gate.sh puts its frame lines, TTY
        # captures and stderr - about 600 KB for the legs that run here. The
        # tests/work path below it is run-frontend.sh's, which this job does
        # not run; it was the only path named until the gate itself did, so a
        # failing gate uploaded an empty directory.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-gate-work
          path: |
            waterbox/work/gate/
            waterbox/tests/work/

  frontend-gate:
    # waterbox/tests/run-frontend.sh, which until today was run by nobody.
    #
    # Two of its six legs need no content. `game:frontend` boots lv2test.elf
    # out of the PACKAGE in Chimera headless - Mono, a private Xvfb, the real
    # generic waterbox adapter - and requires the machine's main memory after
    # 200 frames to equal run-wbx's byte for byte. It is the only leg anywhere
    # in this project that holds the thing users DOWNLOAD to the sandbox
    # reference; everything in the other job proves things about a build tree.
    # `keybinds` requires the package's default bindings to have become the
    # frontend's. The other four want Sony's firmware and a commercial disc,
    # so they SKIP - by name, one line each, counted in the script's summary.
    #
    # This job COMPILES NO RPCS3. The package and run-wbx are core-gate's
    # artifacts and core.wbx is unzipped back out of the package itself, so
    # the binary compared here is literally the binary that ships rather than
    # a second build that happens to agree. Nor does it want the native
    # reference: "native == sandbox" is core-gate's claim, and this job's
    # reference is the sandbox. What it does pay for is Chimera - the natives
    # and the solution - which is about eight runner-minutes and is measured
    # in docs/PLAN.md under "What CI runs".
    name: "frontend gate (the package, through Chimera)"
    needs: [ core-gate ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        # No submodules, deliberately: nothing here is compiled from
        # extern/rpcs3. All this job wants from this repository is
        # tests/roms/lv2test.elf, waterbox/tests/ and
        # waterbox/default_keybinds.json, all of them committed. The recursive
        # init the other job needs costs it about three minutes.

      - name: Check out Chimera (the frontend under test)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: false

      - name: Install build dependencies
        # No g++-13 and no cmake beyond what Chimera's own natives want: the
        # LLVM and the rpcs3 emulator library are the other job's problem.
        # xvfb and mono-complete are what make this job different from it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 unzip mono-complete xvfb libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Check out what Chimera is built from
        working-directory: chimera-checkout
        run: git submodule update --init --recursive extern

      - name: Build Chimera's natives
        # libchimera and friends, into build/dll where the frontend dlopens
        # them. This is the expensive half of the job (about seven minutes on
        # a runner) and it is not cached: a meson tree restored beside a fresh
        # checkout has older timestamps than its sources, so ninja rebuilds it
        # anyway and the cache buys a download instead of a build.
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build the Chimera solution
        # run-frontend.sh runs build/Chimera.exe under Mono; there is no
        # frontend to gate without this step.
        working-directory: chimera-checkout
        run: dotnet build source/gui/Chimera.sln -c Release /nodeReuse:false -p:UseSharedCompilation=false

      - name: Build the miniBox host library run-wbx is linked against
        # Only the host flavor: the C++ GUEST toolchain is what takes minutes,
        # and nothing here cross-compiles anything. The gate runs run-wbx with
        # LD_LIBRARY_PATH unset on purpose (so Chimera's own copy cannot
        # shadow it), which leaves the binary's RUNPATH as the only way it
        # finds libminiboxhost.so - hence this path, which is the one the
        # other job linked it against.
        #
        # Not cached, and that is deliberate: the guest-toolchain cache key is
        # shared with core-gate, and a save from here - with build/meson-cpp
        # missing - would be restored by core-gate for ever after, which is
        # the exact trap the `v2` in the LLVM key was added to escape.
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"

      - name: Fetch the gated package
        uses: actions/download-artifact@v5
        with:
          name: rpcs3-${{ github.sha }}
          path: chimera-checkout/build/Cores

      - name: Fetch the sandbox driver
        uses: actions/download-artifact@v5
        with:
          name: rpcs3-run-wbx-${{ github.sha }}
          path: waterbox/bin

      - name: Unpack what ships, and prove the driver can start
        # core.wbx comes OUT OF THE PACKAGE rather than out of a build, so the
        # reference side of game:frontend runs the same bytes the frontend
        # side loads. An artifact download does not carry the executable bit.
        # The ldd check turns "libminiboxhost.so is not where the RUNPATH
        # says" from an obscure "reference runner error" inside the gate into
        # a named failure here.
        run: |
          chmod +x waterbox/bin/run-wbx
          unzip -o -q chimera-checkout/build/Cores/rpcs3.chimeraCore core.wbx -d waterbox/bin
          ls -l waterbox/bin
          ldd waterbox/bin/run-wbx
          if ldd waterbox/bin/run-wbx | grep -q "not found"; then
            echo "run-wbx cannot resolve its libraries; the gate's reference would fail" >&2
            exit 1
          fi

      - name: Frontend gate
        # Two legs run, four SKIP by name and the script prints
        # "N ok, M failed, K skipped". Which legs those are, and who owns
        # running the other four, is the table in docs/PLAN.md.
        run: ./waterbox/tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Upload the frontend work dir on failure
        # the RAM dumps, the meta files and Chimera's own stdout/stderr
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-gate-work
          path: waterbox/tests/work/

  publish:
    # What the gate passed, published as this core's own release: a rolling
    # `dev` on every green push to main, an immutable `nightly-YYYY-MM-DD` from
    # the scheduled run. Chimera ships no cores; its Core Manager downloads
    # them from here.
    #
    # The logic is Chimera's tools/publish-core.sh, called through one reusable
    # workflow, so all fifteen cores publish the same way and there is one place
    # to change it.
    name: publish
    needs: [ core-gate, frontend-gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: rpcs3
      artifact: rpcs3-${{ github.sha }}
      package: rpcs3.chimeraCore
      kind: ${{ github.event.inputs.kind }}

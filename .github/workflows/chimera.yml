name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package.
#
# What this job can prove is bounded by content. Sony's firmware (PS3UPDAT.PUP)
# and any commercial disc are the user's to supply, so the legs that want them
# report SKIP. What runs needs neither: the machine starts, its virtual clock is
# its own, savestates round-trip, and the sandboxed build agrees with the native
# one - over the small PPC programs in tests/, which are assembled here from
# source rather than shipped as binaries.
#
# This is the expensive core. It builds LLVM twice (host and guest), which is
# hours on a runner and changes only when the pin does - hence its own cache key,
# restored last so it wins.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 04:00 UTC. A nightly is published only when main moved since the last one;
    # the reusable workflow checks, so an unchanged core costs one idle run.
    - cron: '0 4 * * *'

# Keyed by the EVENT as well as the ref. The nightly schedule and a push to
# main are the same workflow on the same ref, so without the event in the key
# whichever starts second cancels the first - and because the publish depends
# on the gate that was cancelled, the release is skipped with nothing anywhere
# reporting a failure. They collide at all because GitHub runs these crons
# hours late: this one asks for 04:00 and starts around 08:30. A push still
# supersedes an older push on the same ref, which is what cancel-in-progress
# is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  core-gate:
    # ONE job, not the two the content-rich cores use. This core's frontend half
    # is Chimera's contract tests, which need the package and nothing else - so
    # splitting it would build the package twice, on two runners, for no more
    # proof than one build gives.
    name: "core gate (starts, deterministic, native == sandbox)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          # RECURSIVE, not true. RPCS3 keeps its own third parties as
          # submodules of a submodule - LLVM among them - and one level of
          # init leaves extern/rpcs3/3rdparty/llvm/llvm an empty directory,
          # which is where the first run of this workflow stopped.
          submodules: recursive

      - name: Check out Chimera (the waterbox host, the guest toolchain, the frontend)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 mono-complete libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Check out what Chimera is built from
        working-directory: chimera-checkout
        run: git submodule update --init --recursive extern

      - name: Build Chimera's natives
        # The contract tests below open a package through the ENGINE, which is
        # libchimera - so they dlopen a native library and fail without one.
        # (Found by moving build/dll aside and watching them go red.)
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Which LLVM this build pins
        # The key below has to change when the LLVM SOURCE changes, and the
        # source is a submodule of a submodule: .gitmodules only names the
        # remote, so bumping extern/rpcs3 to a newer LLVM would leave the key
        # identical and the job would restore, and ship, the old one. The
        # pinned commit is the honest key.
        id: llvm-pin
        run: echo "sha=$(git -C extern/rpcs3 rev-parse HEAD:3rdparty/llvm/llvm)" >> "$GITHUB_OUTPUT"

      - name: Cache LLVM (hours to build; changes only when the pin does)
        uses: actions/cache@v4
        with:
          path: |
            build/llvm-native
            build/llvm-guest
          key: rpcs3-llvm-${{ runner.os }}-${{ hashFiles('waterbox/build-llvm.sh') }}-${{ steps.llvm-pin.outputs.sha }}

      - name: Build the waterbox core
        # The GUEST only. The native reference needs LLVM and ffmpeg built for
        # the host as well, on top of rpcs3_emu twice - hours beyond this - and
        # without firmware it would prove nothing the guest build does not.
        # native == sandbox is run by hand, against the developer's own content.
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          MINIBOX_DIR="$mb" ./waterbox/build-package.sh -m "$mb" -r "$PWD/chimera-checkout"

      - name: Core gate
        run: |
          # run-gate.sh compares against the native reference, which is not built
          # here (see above). What CI holds the guest to is that the sandbox will
          # accept it: no thread-local storage, no forbidden imports, the layout
          # the host maps.
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          sh "$mb/source/guest/check-wbx.sh" waterbox/bin/core.wbx
          echo "SKIP emulation legs: no PS3 firmware on a public runner (waterbox/run-gate.sh, by hand)"

      - name: Build and install the waterbox core package
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: ./waterbox/build-package.sh -m "$PWD/chimera-checkout/extern/chimera-common-minibox" -r "$PWD/chimera-checkout"

      - name: The package through the real frontend
        # Chimera's own contract tests, run against THIS package: it must be
        # readable, built for an ABI this frontend runs, become a working
        # factory, bind only buttons its controller declares, and stamp a
        # version. No rom, no firmware, no emulation - which is exactly why it
        # is the frontend check a core like this one can make.
        working-directory: chimera-checkout
        env:
          CHIMERA_CORES_DIR: ${{ github.workspace }}/chimera-checkout/build/Cores
        run: |
          dotnet test source/gui/Chimera.Tests.Client.Common/Chimera.Tests.Client.Common.csproj \
            -c Release --nologo \
            --filter "FullyQualifiedName~InstalledCorePackagesTests|FullyQualifiedName~MnemonicUniquenessTests"

      - name: Publish the core package
        uses: actions/upload-artifact@v7
        with:
          name: rpcs3-${{ github.sha }}
          path: chimera-checkout/build/Cores/rpcs3.chimeraCore
          if-no-files-found: error

      - name: Upload the gate work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-gate-work
          path: waterbox/tests/work/

  publish:
    # What the gate passed, published as this core's own release: a rolling
    # `dev` on every green push to main, an immutable `nightly-YYYY-MM-DD` from
    # the scheduled run. Chimera ships no cores; its Core Manager downloads
    # them from here.
    #
    # The logic is Chimera's tools/publish-core.sh, called through one reusable
    # workflow, so all fifteen cores publish the same way and there is one place
    # to change it.
    name: publish
    needs: [ core-gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: rpcs3
      artifact: rpcs3-${{ github.sha }}
      package: rpcs3.chimeraCore
      kind: ${{ github.event.inputs.kind }}
